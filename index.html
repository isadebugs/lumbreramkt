<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMBRERA MARKETING</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Century+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pantalla de bienvenida -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <h1 class="welcome-title" id="welcomeTitle">LUMBRERA MARKETING</h1>
            <div class="light-effect"></div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container" id="mainContent">
        <!-- Bloque superior / Header -->
        <header class="header">
            <!-- Logo y título en la izquierda -->
            <div class="logo-section">
                <div class="logo-placeholder">
                    <i class="fas fa-lightbulb"></i>
                </div>
                <h1 class="site-title">LUMBRERA MARKETING</h1>
            </div>

            <!-- Carrusel de eslogan en el centro -->
            <div class="slogan-carousel">
                <div class="carousel-slides">
                    <div class="slide active">
                        <span class="slogan">VER DONDE OTROS MIRAN</span>
                    </div>
                    <div class="slide">
                        <span class="slogan">ILUMINANDO TU MARCA</span>
                    </div>
                    <div class="slide">
                        <span class="slogan">ESTRATEGIAS BRILLANTES</span>
                    </div>
                </div>
                <div class="carousel-dots">
                    <span class="dot active" data-slide="0"></span>
                    <span class="dot" data-slide="1"></span>
                    <span class="dot" data-slide="2"></span>
                </div>
            </div>

            <!-- Botón de contacto en la derecha -->
            <div class="contact-section">
                <button class="contact-btn" id="contactBtn">
                    <i class="fas fa-envelope"></i> CONTACTO
                </button>
            </div>
        </header>

        <!-- Contenido principal (para futura expansión) -->
        <main class="main-content">
            <div class="content-placeholder">
                <h2>Contenido Principal</h2>
                <p>Aquí irá el contenido principal de tu sitio web.</p>
                <p>Puedes agregar secciones para servicios, portfolio, equipo, testimonios, etc.</p>
            </div>
        </main>

        <!-- Modal de contacto (oculto por defecto) -->
        <div class="modal" id="contactModal">
            <div class="modal-content">
                <span class="close-btn" id="closeModal">&times;</span>
                <h2>Contacta con LumbRera Marketing</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje:</label>
                        <textarea id="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
